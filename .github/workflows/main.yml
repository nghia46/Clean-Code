name: Build Test

on:
  push:
    branches:
      - main

jobs:
  Build-And-Test:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore

      # Check NuGet package status
      - name: Check NuGet packages
        run: dotnet list package

      # Check vulnerable NuGet packages
      - name: Check NuGet vulnerabilities
        run: dotnet list package --vulnerable --include-transitive

      # Build
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Run tests
      - name: Run MSTest
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      # Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
